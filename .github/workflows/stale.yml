name: Mark Stale Issues and PRs

on:
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight UTC
  workflow_dispatch:  # Allow manual trigger

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/stale@v9
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}

        # Issue settings
        stale-issue-message: |
          This issue has been automatically marked as stale because it has not had
          recent activity. It will be closed if no further activity occurs within
          the next 7 days. Thank you for your contributions!
        close-issue-message: |
          This issue was automatically closed due to inactivity. If you believe this
          issue is still relevant, please reopen it or create a new issue.
        stale-issue-label: 'stale'
        exempt-issue-labels: 'pinned,security,roadmap'
        days-before-stale: 90
        days-before-close: 7

        # PR settings
        stale-pr-message: |
          This pull request has been automatically marked as stale because it has not had
          recent activity. It will be closed if no further activity occurs within
          the next 14 days. Please update the PR or reach out if you need help!
        close-pr-message: |
          This pull request was automatically closed due to inactivity. If you would
          like to continue working on this, please reopen it and update it accordingly.
        stale-pr-label: 'stale'
        exempt-pr-labels: 'pinned,security,work-in-progress'
        days-before-pr-stale: 60
        days-before-pr-close: 14

        # General settings
        operations-per-run: 100
        remove-stale-when-updated: true
        ascending: true
