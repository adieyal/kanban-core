name: Documentation

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docs/**'
      - '*.md'
      - 'src/kanban/**/*.py'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'docs/**'
      - '*.md'

jobs:
  lint-docs:
    name: Lint Documentation
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check Markdown links
      uses: gaurav-nelson/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: 'yes'
        use-verbose-mode: 'yes'
        config-file: '.github/markdown-link-check-config.json'
        folder-path: 'docs'
        file-path: './README.md'

    - name: Lint Markdown files
      uses: nosborn/github-action-markdown-cli@v3.3.0
      with:
        files: .
        config_file: .markdownlint.json
        ignore_files: node_modules
      continue-on-error: true

  check-examples:
    name: Verify Code Examples
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Extract and test code examples from README
      run: |
        python scripts/test_readme_examples.py
      continue-on-error: true

    - name: Test examples in docs directory
      run: |
        if [ -d "docs/examples" ]; then
          for file in docs/examples/*.py; do
            if [ -f "$file" ]; then
              echo "Testing $file..."
              python "$file"
            fi
          done
        fi
      continue-on-error: true

  build-api-docs:
    name: Build API Documentation
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install pdoc3

    - name: Generate API documentation
      run: |
        pdoc --html --output-dir api-docs src/kanban

    - name: Upload API docs
      uses: actions/upload-artifact@v4
      with:
        name: api-documentation
        path: api-docs/
        retention-days: 30
